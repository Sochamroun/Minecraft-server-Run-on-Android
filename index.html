
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Music Player</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10131b;
      color: white;
      font-family: Arial, sans-serif;
    }
    .player {
      width: min(360px, 85%);
      padding: 28px;
      text-align: center;
      background: #1d2330;
      border-radius: 20px;
    }
    .cover {
      font-size: 70px;
      margin: 10px;
    }
    h1 { font-size: 24px; }
    p { color: #aab4c5; }
    audio { width: 100%; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="player">
    <div class="cover">🎵</div>
    <h1>My Music</h1>
    <p>Listen to my favorite track</p>

    <audio controls preload="metadata">
      <source src="https://github.com/Sochamroun/Minecraft-server-Run-on-Android/blob/204e67e865610cb0960c13f466ceea1c21c351e3/audio/music.mp3" type="audio/mpeg">
      Your browser does not support audio.
    </audio>
  </main>
</body>
</html>
